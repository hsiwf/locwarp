name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您的建议!请详细说明需求,以便评估可行性与优先顺序。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 当前有什么不方便或缺少的功能?
      placeholder: 当前使用时遇到...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望 LocWarp 如何处理或新增什么功能?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案(选填)
      description: 是否考虑过其他作法?或当前是否有 workaround?

  - type: textarea
    id: extra
    attributes:
      label: 其他补充(选填)
      description: 参考资料、类似项目、UI mockup 等
