name: Bug 回报
description: 回报使用上遇到的问题或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: locwarp-version
    attributes:
      label: LocWarp 版本
      placeholder: 例如 v0.1.16
    validations:
      required: true

  - type: dropdown
    id: ios-version
    attributes:
      label: iOS 版本
      options:
        - iOS 26.x
        - iOS 18.x
        - iOS 17.x
        - iOS 16.x
        - 其他
    validations:
      required: true

  - type: input
    id: iphone-model
    attributes:
      label: iPhone 机型
      placeholder: 例如 iPhone 16 Pro Max

  - type: dropdown
    id: connection
    attributes:
      label: 连接方式
      options:
        - USB 有线
        - WiFi Tunnel(iOS 17+)
        - 旧版 WiFi 直连(iOS 17 以下)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述遇到的问题、重现步骤、错误信息、截图等
    validations:
      required: true
